<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Product Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <header class="bg-blue-600 text-white shadow-md py-6">
        <div class="max-w-6xl mx-auto px-4">
            <h1 class="text-3xl font-bold">Multi-Modal Product Discovery</h1>
            <p class="text-blue-100 mt-2">Search by text, image, or both using Vector AI</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <form id="searchForm" class="flex flex-col md:flex-row gap-4 items-center">
                
                <div class="flex-1 w-full">
                    <label class="block text-sm font-medium text-gray-700 mb-1">What are you looking for?</label>
                    <input type="text" id="queryInput" placeholder="e.g. Comfortable running shorts..." 
                           class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="w-full md:w-auto">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Or upload an image</label>
                    <input type="file" id="imageInput" accept="image/*" 
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <div class="w-full md:w-auto mt-auto">
                    <button type="submit" id="searchBtn"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md transition duration-200">
                        Search with AI
                    </button>
                </div>
            </form>
        </div>

        <div id="loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 text-gray-500">AI is analyzing your request...</p>
        </div>

        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const query = document.getElementById('queryInput').value;
            const imageFile = document.getElementById('imageInput').files[0];
            const searchBtn = document.getElementById('searchBtn'); // 1. Get the button
            
            if (!query && !imageFile) {
                alert("Please enter a text query or upload an image!");
                return;
            }

            // 2. Disable the button and change its text
            searchBtn.disabled = true;
            searchBtn.innerText = "Searching...";
            searchBtn.classList.add('opacity-50', 'cursor-not-allowed');

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultsGrid').innerHTML = '';

            const formData = new FormData();
            if (query) formData.append('query', query);
            if (imageFile) formData.append('image', imageFile);
            formData.append('top_k', 12);

            try {
                const response = await fetch('/api/v1/search', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Search failed");
                const data = await response.json();
                
                renderResults(data.results);
            } catch (error) {
                console.error(error);
                alert("An error occurred while searching.");
            } finally {
                // 3. Re-enable the button when finished!
                searchBtn.disabled = false;
                searchBtn.innerText = "Search AI";
                searchBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                document.getElementById('loading').classList.add('hidden');
            }
        });

        function renderResults(results) {
            const grid = document.getElementById('resultsGrid');
            
            if (!results || results.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">No products found. Try a different search.</p>`;
                return;
            }

            // Loop through the JSON response and build HTML cards
            results.forEach(item => {
                const p = item.payload;
                const card = `
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden hover:shadow-lg transition duration-200 flex flex-col">
                        <div class="h-48 bg-white p-4 flex items-center justify-center">
                            <img src="${p.image_url}" alt="Product Image" class="max-h-full max-w-full object-contain">
                        </div>
                        <div class="p-4 flex flex-col flex-grow border-t border-gray-100">
                            <h3 class="text-sm font-medium text-gray-900 line-clamp-2 mb-2" title="${p.product_name}">${p.product_name}</h3>
                            <div class="mt-auto flex items-center justify-between">
                                <span class="text-lg font-bold text-gray-900">$${p.price.toFixed(2)}</span>
                                <span class="text-sm text-yellow-500 font-medium">★ ${p.stars}</span>
                            </div>
                            <a href="${p.product_url}" target="_blank" class="mt-3 block w-full text-center bg-gray-100 hover:bg-gray-200 text-gray-800 text-sm font-medium py-2 rounded transition">
                                View on Amazon
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }
    </script>
</body>
</html>
